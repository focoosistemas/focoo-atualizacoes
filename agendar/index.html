<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Agendamento</title>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<style>
:root{--ink:#16202c;--muted:#6b7480;--line:#e6e8ec;--bg:#f6f7f9;--card:#fff;--brand:#1f2933;--ok:#1e7a4b;--warn:#b4441f;--r:14px}
*{box-sizing:border-box}html,body{margin:0}
body{font-family:"Segoe UI",Inter,system-ui,-apple-system,sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:20px 16px 90px}
.head{display:flex;gap:14px;align-items:center;margin:6px 0 18px}
.head img{width:56px;height:56px;object-fit:contain;border-radius:12px;background:#fff;border:1px solid var(--line)}
.head h1{font-size:21px;margin:0;line-height:1.2}.head p{margin:3px 0 0;color:var(--muted);font-size:13.5px}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;margin-bottom:14px}
.lbl{font-size:12.5px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.dias{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.dias::-webkit-scrollbar{display:none}
.dia{flex:0 0 auto;min-width:64px;text-align:center;border:1px solid var(--line);border-radius:12px;padding:8px 6px;background:#fff;cursor:pointer;user-select:none}
.dia b{display:block;font-size:19px}.dia span{font-size:11.5px;color:var(--muted);text-transform:capitalize}
.dia.on{background:var(--brand);border-color:var(--brand);color:#fff}.dia.on span{color:#cfd5dc}
select,input,textarea{width:100%;font:inherit;font-size:15.5px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
select:focus,input:focus,textarea:focus{outline:2px solid #c7ced6;border-color:#c7ced6}
.grade{display:grid;grid-template-columns:repeat(auto-fill,minmax(98px,1fr));gap:8px}
.slot{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 6px;text-align:center;cursor:pointer;transition:.12s}
.slot:hover{border-color:var(--brand);transform:translateY(-1px)}
.slot b{display:block;font-size:16px}.slot span{display:block;font-size:11.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grupo{margin-top:14px}.grupo h3{font-size:14px;margin:0 0 8px}
.vazio{text-align:center;color:var(--muted);padding:26px 10px;font-size:14.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;width:100%;font:inherit;font-weight:600;font-size:15.5px;padding:13px 16px;border-radius:11px;border:0;background:var(--brand);color:#fff;cursor:pointer;text-decoration:none}
.btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}.btn:disabled{opacity:.6}
.campo{margin-bottom:12px}.campo label{display:block;font-size:13px;font-weight:600;margin-bottom:5px}
.ov{position:fixed;inset:0;background:rgba(15,20,28,.45);display:none;align-items:flex-end;justify-content:center;z-index:9}
.ov.on{display:flex}.sheet{background:#fff;width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-height:92vh;overflow:auto}
@media(min-width:600px){.ov{align-items:center}.sheet{border-radius:18px}}
.sheet h2{font-size:18px;margin:0 0 4px}.sub{color:var(--muted);font-size:14px;margin:0 0 14px}
.erro{color:var(--warn);font-size:13.5px;margin:6px 0 10px;min-height:1px}
.ok{text-align:center;padding:10px 0}.ok .ic{width:58px;height:58px;border-radius:50%;background:#e7f4ec;color:var(--ok);display:flex;align-items:center;justify-content:center;margin:0 auto 12px;font-size:30px}
.pills{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.pill{font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--muted)}
.rodape{text-align:center;color:#a0a7b0;font-size:12px;margin-top:22px}
.skel{height:14px;background:linear-gradient(90deg,#eef0f3,#f7f8fa,#eef0f3);background-size:200% 100%;animation:sk 1.2s infinite;border-radius:8px;margin:8px 0}
@keyframes sk{0%{background-position:200% 0}100%{background-position:-200% 0}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="card"><div class="skel" style="width:50%"></div><div class="skel"></div><div class="skel" style="width:70%"></div></div></div>
<div class="ov" id="ov"><div class="sheet" id="sheet"></div></div>
<script>
/* Página pública de agendamento FOCOO (clínicas e arenas). Lê só os horários livres publicados pelo Emissor e
   reserva em transação: se dois clientes tentarem o mesmo horário, só o primeiro consegue. */
firebase.initializeApp({apiKey:"AIzaSyAhVknRGY308_QsjigOwuaDHsrgNA6-3dk",authDomain:"focoo-clinicas.firebaseapp.com",projectId:"focoo-clinicas",
  storageBucket:"focoo-clinicas.firebasestorage.app",messagingSenderId:"14156391471",appId:"1:14156391471:web:aabb553f268821049f92da"});
const db=firebase.firestore();
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const BRL=n=>'R$ '+Number(n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const wa=t=>{t=String(t||'').replace(/\D/g,'');return t.length>11&&t.startsWith('55')?t:'55'+t};
const fmtData=iso=>iso.split('-').reverse().join('/');
const maskTel=v=>{v=String(v||'').replace(/\D/g,'').slice(0,11);if(v.length>10)return `(${v.slice(0,2)}) ${v.slice(2,7)}-${v.slice(7)}`;if(v.length>6)return `(${v.slice(0,2)}) ${v.slice(2,6)}-${v.slice(6)}`;if(v.length>2)return `(${v.slice(0,2)}) ${v.slice(2)}`;return v};
function slug(){const q=new URLSearchParams(location.search).get('c');if(q)return q;const m=location.hash.match(/c=([^&#]+)/);return m?decodeURIComponent(m[1]):'';}
const S={c:slug(),cl:null,livres:[],dia:null,prof:''};
const ARENA=()=>S.cl&&S.cl.tipo==='arena';
const rot=()=>(S.cl&&S.cl.rotulo)||(ARENA()?'Quadra':'Profissional');
function profNome(id){const p=((S.cl&&S.cl.dentistas)||[]).find(x=>String(x.id)===String(id));return p?p.nome:'';}
function profValor(id){const p=((S.cl&&S.cl.dentistas)||[]).find(x=>String(x.id)===String(id));return p?Number(p.valor||0):0;}
function futuro(s){const d=new Date(s.data+'T'+(s.hora||'23:59')+':00');return d.getTime()>Date.now()+5*60000;}
function erroTela(msg){$('#app').innerHTML=`<div class="card vazio">${esc(msg)}</div><div class="rodape">Agendamento online · FOCOO</div>`;}

async function carregar(){
  if(!S.c)return erroTela('Link incompleto. Peça o link de agendamento de novo para quem te enviou.');
  try{
    const doc=await db.collection('clinicas').doc(S.c).get();
    if(!doc.exists)return erroTela('Não encontramos esta agenda. Confirme o link com quem te enviou.');
    S.cl=doc.data();document.title='Agendamento · '+(S.cl.nome||'');
    const snap=await db.collection('clinicas').doc(S.c).collection('agenda').where('status','==','livre').get();
    S.livres=snap.docs.map(d=>({id:d.id,...d.data()})).filter(futuro).sort((a,b)=>(a.data+a.hora).localeCompare(b.data+b.hora));
    const dias=[...new Set(S.livres.map(s=>s.data))];if(!dias.includes(S.dia))S.dia=dias[0]||null;
    desenhar();
  }catch(e){console.error(e);erroTela('Não foi possível carregar os horários agora. Tente de novo em instantes.');}
}
function desenhar(){
  const cl=S.cl,dias=[...new Set(S.livres.map(s=>s.data))];
  const profs=(cl.dentistas||[]).filter(p=>S.livres.some(s=>String(s.dentistaId)===String(p.id)));
  const lista=S.livres.filter(s=>s.data===S.dia&&(!S.prof||String(s.dentistaId)===S.prof));
  const grupos={};lista.forEach(s=>(grupos[s.dentistaId]=grupos[s.dentistaId]||[]).push(s));
  $('#app').innerHTML=`
  <div class="head">${cl.logo?`<img src="${esc(cl.logo)}" alt="">`:''}<div><h1>${esc(cl.nome||'Agendamento')}</h1>
    <p>${ARENA()?'Reserve sua quadra':'Agende seu horário'}${cl.endereco?' · '+esc(cl.endereco):''}</p></div></div>
  ${!dias.length?`<div class="card vazio">No momento não há horários livres.${cl.contato?`<br><br><a class="btn ghost" href="https://wa.me/${wa(cl.contato)}" target="_blank">Falar no WhatsApp</a>`:''}</div>`:`
  <div class="card"><p class="lbl">Escolha o dia</p><div class="dias">${dias.map(d=>{const dt=new Date(d+'T12:00:00');
    return `<div class="dia ${d===S.dia?'on':''}" onclick="S.dia='${d}';desenhar()"><span>${dt.toLocaleDateString('pt-BR',{weekday:'short'}).replace('.','')}</span><b>${dt.getDate()}</b><span>${dt.toLocaleDateString('pt-BR',{month:'short'}).replace('.','')}</span></div>`}).join('')}</div>
    ${profs.length>1?`<div style="margin-top:12px"><select onchange="S.prof=this.value;desenhar()"><option value="">${ARENA()?'Todas as quadras':'Todos os profissionais'}</option>${profs.map(p=>`<option value="${esc(p.id)}" ${String(p.id)===S.prof?'selected':''}>${esc(p.nome)}</option>`).join('')}</select></div>`:''}</div>
  <div class="card"><p class="lbl">Horários livres · ${new Date(S.dia+'T12:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'long'})}</p>
    ${Object.keys(grupos).length?Object.entries(grupos).map(([pid,arr])=>`<div class="grupo">${profs.length>1||ARENA()?`<h3>${esc(profNome(pid))}${ARENA()&&profValor(pid)?` <span style="font-weight:400;color:var(--muted)">· ${BRL(profValor(pid))} a hora</span>`:''}</h3>`:''}
      <div class="grade">${arr.map(s=>`<div class="slot" onclick="abrir('${esc(s.id)}')"><b>${esc(s.hora)}</b><span>${s.fim?'até '+esc(s.fim):esc(profNome(s.dentistaId))}</span></div>`).join('')}</div></div>`).join('')
    :'<div class="vazio">Sem horários livres neste dia.</div>'}</div>`}
  <div class="rodape">Agendamento online · FOCOO</div>`;
}
function fechar(){$('#ov').classList.remove('on');}
$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')fechar()});
function abrir(id){const s=S.livres.find(x=>x.id===id);if(!s)return;const conv=S.cl.convenios||[];
  $('#sheet').innerHTML=`<h2>${ARENA()?'Reservar':'Agendar'} ${fmtData(s.data)} às ${esc(s.hora)}</h2>
  <p class="sub">${esc(profNome(s.dentistaId))}${s.fim?' · até '+esc(s.fim):''}${ARENA()&&(s.valor||profValor(s.dentistaId))?' · '+BRL(s.valor||profValor(s.dentistaId)):''}</p>
  <div class="campo"><label>Seu nome</label><input id="b_nome" autocomplete="name"></div>
  <div class="campo"><label>WhatsApp</label><input id="b_tel" inputmode="tel" autocomplete="tel" oninput="this.value=maskTel(this.value)"></div>
  ${ARENA()?'':`<div class="campo"><label>Procedimento ou motivo (opcional)</label><input id="b_proc"></div>
   ${conv.length?`<div class="campo"><label>Atendimento</label><select id="b_tipo" onchange="$('#b_cv').style.display=this.value==='convenio'?'block':'none'"><option value="particular">Particular</option><option value="convenio">Convênio</option></select></div>
   <div class="campo" id="b_cv" style="display:none"><label>Convênio</label><select id="b_conv">${conv.map(c=>`<option value="${esc(c.id)}">${esc(c.nome)}</option>`).join('')}</select></div>`:''}`}
  <div class="campo"><label>Observação (opcional)</label><textarea id="b_obs" rows="2"></textarea></div>
  <div class="erro" id="b_err"></div>
  <button class="btn" id="b_ok" onclick="confirmar('${esc(s.id)}')">Confirmar ${ARENA()?'reserva':'agendamento'}</button>
  <button class="btn ghost" style="margin-top:8px" onclick="fechar()">Voltar</button>`;
  $('#ov').classList.add('on');setTimeout(()=>$('#b_nome').focus(),80);}
async function confirmar(id){const nome=$('#b_nome').value.trim(),tel=$('#b_tel').value.replace(/\D/g,'');
  if(nome.length<3)return $('#b_err').textContent='Informe seu nome.';
  if(tel.length<10)return $('#b_err').textContent='Informe o WhatsApp com DDD.';
  const tipo=($('#b_tipo')||{}).value||'particular';
  const dados={paciente:nome,telefone:tel,procedimento:(($('#b_proc')||{}).value||'').trim(),obs:$('#b_obs').value.trim(),
    tipoAtendimento:tipo,convenioId:tipo==='convenio'?(($('#b_conv')||{}).value||''):''};
  const bt=$('#b_ok');bt.disabled=true;bt.textContent='Confirmando...';
  const ref=db.collection('clinicas').doc(S.c).collection('agenda').doc(id);
  try{
    const s=await db.runTransaction(async t=>{const d=await t.get(ref);if(!d.exists||d.data().status!=='livre')throw new Error('ocupado');t.update(ref,{...dados,status:'agendado'});return d.data();});
    confirmado(s,nome);
  }catch(e){
    if(e.message==='ocupado'){fechar();alert('Este horário acabou de ser ocupado. Escolha outro, por favor.');carregar();}
    else{console.error(e);bt.disabled=false;bt.textContent='Tentar de novo';$('#b_err').textContent='Não foi possível confirmar agora. Confira a internet e tente de novo.';}
  }}
function gcal(s){const p=n=>String(n).padStart(2,'0');const [h,m]=s.hora.split(':').map(Number);const fimM=s.fim?s.fim.split(':').map(Number):[h+(m+30>=60?1:0),(m+30)%60];
  const d=s.data.replace(/-/g,'');const tit=encodeURIComponent((ARENA()?'Quadra':'Consulta')+' · '+(S.cl.nome||''));
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${tit}&dates=${d}T${p(h)}${p(m)}00/${d}T${p(fimM[0])}${p(fimM[1])}00&location=${encodeURIComponent(S.cl.endereco||'')}`;}
function confirmado(s,nome){const tel=String(S.cl.contato||'').replace(/\D/g,'');
  $('#sheet').innerHTML=`<div class="ok"><div class="ic">✓</div><h2>${ARENA()?'Reserva feita':'Agendamento feito'}</h2>
  <p class="sub">${esc(nome)}, seu horário é <b>${fmtData(s.data)} às ${esc(s.hora)}</b><br>${esc(profNome(s.dentistaId))}</p>
  ${ARENA()?'<p class="sub">O pagamento é combinado com a arena.</p>':''}
  <a class="btn" href="${gcal(s)}" target="_blank">Adicionar à minha agenda</a>
  ${tel?`<a class="btn ghost" style="margin-top:8px" href="https://wa.me/${wa(tel)}?text=${encodeURIComponent('Olá! Acabei de agendar pelo link: '+fmtData(s.data)+' às '+s.hora+' ('+nome+').')}" target="_blank">Avisar pelo WhatsApp</a>`:''}
  <button class="btn ghost" style="margin-top:8px" onclick="fechar();carregar()">Fechar</button></div>`;}
carregar();
</script>
</body>
</html>
